<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#05070d"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <meta
      name="description"
      content="FinSight — an advanced personal finance intelligence platform for tracking, analyzing, planning, and understanding your financial life."
    />

    <meta
      name="application-name"
      content="FinSight"
    />

    <meta
      name="author"
      content="FinSight"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="FinSight"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- ================================================================
         SOCIAL / SHARE METADATA
         ================================================================ -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="FinSight — Financial Intelligence"
    />

    <meta
      property="og:description"
      content="An advanced personal finance intelligence workspace."
    />

    <meta
      property="og:site_name"
      content="FinSight"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="FinSight — Financial Intelligence"
    />

    <meta
      name="twitter:description"
      content="An advanced personal finance intelligence workspace."
    />

    <!-- ================================================================
         PERFORMANCE
         ================================================================ -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="dns-prefetch"
      href="//fonts.googleapis.com"
    />

    <!-- ================================================================
         PREMIUM TYPOGRAPHY
         ================================================================ -->

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ================================================================
         APPLICATION TITLE
         ================================================================ -->

    <title>
      FinSight — Financial Intelligence
    </title>
  </head>

  <body>
    <!-- ==============================================================
         STATIC BOOT EXPERIENCE

         This exists before React mounts.
         main.jsx removes it after React successfully takes over.
         ============================================================== -->

    <div
      id="finsight-static-boot"
      aria-hidden="true"
    >
      <div class="fs-static-boot-inner">
        <div class="fs-static-boot-logo">
          F
        </div>

        <div class="fs-static-boot-title">
          FinSight
        </div>

        <div class="fs-static-boot-subtitle">
          Financial intelligence workspace
        </div>

        <div class="fs-static-boot-bar">
          <span></span>
        </div>
      </div>
    </div>

    <!-- ==============================================================
         NO JAVASCRIPT FALLBACK
         ============================================================== -->

    <noscript>
      <div
        style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:24px;
          background:#05070d;
          color:#f5f7fa;
          font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
          text-align:center;
        "
      >
        <div
          style="
            width:min(520px,100%);
            padding:36px;
            border:1px solid rgba(255,255,255,.08);
            border-radius:24px;
            background:rgba(255,255,255,.035);
          "
        >
          <div
            style="
              width:52px;
              height:52px;
              margin:0 auto 20px;
              display:grid;
              place-items:center;
              border-radius:16px;
              background:linear-gradient(135deg,#7058ff,#9b63ff);
              color:white;
              font-size:22px;
              font-weight:900;
            "
          >
            F
          </div>

          <h1
            style="
              margin:0;
              font-size:26px;
              letter-spacing:-.04em;
            "
          >
            FinSight requires JavaScript
          </h1>

          <p
            style="
              margin:12px 0 0;
              color:#7d899c;
              line-height:1.7;
              font-size:14px;
            "
          >
            Please enable JavaScript in your browser
            to use the FinSight financial workspace.
          </p>
        </div>
      </div>
    </noscript>

    <!-- ==============================================================
         REACT APPLICATION ROOT
         ============================================================== -->

    <div id="root"></div>

    <!-- ==============================================================
         VITE / REACT ENTRY
         ============================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
