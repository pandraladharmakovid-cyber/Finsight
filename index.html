<!doctype html>
<html lang="en" data-theme="aurora">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="FinSight — a live financial intelligence workspace for accounts, budgets, savings, debts and analytics."
    />
    <meta name="theme-color" content="#05060f" />
    <title>FinSight — Financial Intelligence</title>
  </head>
  <body>
    <div id="finsight-boot" aria-hidden="true">
      <div class="boot-core">
        <div class="boot-ring"></div>
        <div class="boot-ring boot-ring-2"></div>
        <div class="boot-mark">F</div>
      </div>
      <p class="boot-label">FINSIGHT</p>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <style>
      /* Styles that must exist before the JS bundle loads. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05060f;
        color: #e8ecff;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #finsight-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background:
          radial-gradient(
            circle at 50% 45%,
            rgba(124, 92, 255, 0.18),
            transparent 55%
          ),
          #05060f;
        z-index: 9999;
        transition:
          opacity 0.55s ease,
          visibility 0.55s ease;
      }

      #finsight-boot.boot-done {
        opacity: 0;
        visibility: hidden;
      }

      .boot-core {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
      }

      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #7c5cff;
        border-right-color: #22d3ee;
        animation: boot-spin 1.1s linear infinite;
      }

      .boot-ring-2 {
        inset: 13px;
        border-top-color: #34d399;
        border-right-color: transparent;
        animation-duration: 1.7s;
        animation-direction: reverse;
      }

      .boot-mark {
        width: 46px;
        height: 46px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.02em;
        color: #06070f;
        background: linear-gradient(135deg, #b7a6ff, #6ee7f9 55%, #6ee7b7);
        box-shadow: 0 0 42px rgba(124, 92, 255, 0.55);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }

      .boot-label {
        margin: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.55em;
        color: rgba(232, 236, 255, 0.55);
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.07);
        }
      }
    </style>
  </body>
</html>
